<script>
  function toggleSiteLang() {
    var isZh = document.body.classList.toggle('lang-zh');
    localStorage.setItem('site-lang', isZh ? 'zh' : 'en');
    var btn = document.getElementById('lang-toggle');
    if (btn) btn.textContent = isZh ? 'EN' : '中';
  }
</script>
